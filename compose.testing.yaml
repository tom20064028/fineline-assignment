# Requires Docker Compose >= 2.24.4 for !override.
# Use -p fineline-testing to keep the normal stack and archives isolated.
name: fineline-testing
services:
  frontend:
    ports: !override
      - "127.0.0.1:4180:8080"
  publishing-api:
    ports: !override
      - "127.0.0.1:4181:3001"
    environment:
      CLIENT_ID: test-client
      CLIENT_SECRET: test-secret
      API_DOCS_ENABLED: "true"
  source-stub:
    environment:
      SOURCE_TEST_MODE: "true"
      SOURCE_TEST_DELAY_MS: ${DEMO_DELAY_MS:-2500}
  vendor-stub:
    environment:
      VENDOR_FAILURE_RATE: ${TEST_VENDOR_FAILURE_RATE:-0}
