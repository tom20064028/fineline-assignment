name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_ID: ci-client
      CLIENT_SECRET: ci-local-test-secret
      VENDOR_FAILURE_RATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: docker compose -p fineline-testing -f compose.yaml -f compose.testing.yaml config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: npm run smoke
      - run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3001/openapi.json
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/api/docs/
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_CLIENT_ID: ci-client
          E2E_CLIENT_SECRET: ci-local-test-secret
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
